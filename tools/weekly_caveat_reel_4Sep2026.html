html,body{background:#000;height:100%;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;background:

#stage::before{content:'';position:absolute;inset:0;background-image:
  linear-gradient(rgba(124,140,248,.045) 1px,transparent 1px),

#stage::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 340px 90px rgba(0,0,0,.55);pointer-events:none}

/* chrome */
.chrome{position:absolute;left:0;right:0;text-align:center;z-index:5}
#logo{top:84px}
#logo .mono{display:inline-block;border:3px solid var(--gold);color:var(--gold);

  padding:14px 26px;border-radius:6px}
#footer{bottom:70px;font-family:var(--font-mono);font-size:26px;color:var(--gray2);letter-spacing:3px}
#dots{bottom:132px}
#dots span{display:inline-block;width:14px;height:14px;border-radius:50%;background:#22314e;margin:0 9px;transition:background .4s}
#dots span.on{background:var(--gold)}

/* screens */
.screen{position:absolute;inset:0;padding:250px 84px 220px;opacity:0;transition:opacity .55s;display:flex;flex-direction:column}
.screen.show{opacity:1}
.kicker{font-family:var(--font-mono);font-size:28px;letter-spacing:7px;color:var(--gold);text-transform:uppercase;margin-bottom:26px}
.title{font-weight:800;font-size:72px;line-height:1.06;letter-spacing:-1px}
.subtag{font-family:var(--font-mono);font-size:30px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-top:20px}
.subtag .dim{color:var(--gray)}

/* intro */
#s-intro{align-items:center;justify-content:center;text-align:center;padding-top:0}
#s-intro .kicker{font-size:32px;margin-bottom:34px}
#s-intro .week{font-weight:800;font-size:88px;letter-spacing:-1px;margin-bottom:64px}
#s-intro .big{font-weight:800;font-size:210px;letter-spacing:-6px;color:var(--gold);line-height:1;text-shadow:0 0 90px rgba(224,178,90,.25)}
#s-intro .caveats{font-family:var(--font-mono);font-size:36px;letter-spacing:6px;color:var(--white);margin-top:46px}
#s-intro .caveats .dim{color:var(--gray)}
.splitwrap{width:780px;margin-top:78px}
.splitbar{display:flex;height:26px;border-radius:13px;overflow:hidden;background:#1a2740}
.splitbar .ind{background:var(--peri)}.splitbar .com{background:var(--gold)}
.splitlab{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:26px;letter-spacing:3px;margin-top:20px}
.splitlab .l{color:var(--peri)}.splitlab .r{color:var(--gold)}

/* rows (leaderboards + pnl) */
.rows{margin-top:48px;display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;background:linear-gradient(180deg,var(--card),#0c1728);
  border:1px solid var(--card-br);border-radius:16px;padding:24px 34px;
  opacity:0;transform:translateY(26px);transition:opacity .5s,transform .5s}
.row.in{opacity:1;transform:none}
.row .rank{font-family:var(--font-mono);font-weight:700;font-size:56px;color:var(--gold);width:88px;flex:none}
.row .who{flex:1;min-width:0;padding-right:24px}
/* L-SLIDE-6 (binding): .val is PINNED. It was flex:none, so its width varied
   with the value string and silently squeezed .who by a different amount on
   every row — which is why identical-length lines cropped on some rows and
   not others. A fixed value column makes the text column deterministic. */
.row .val{width:240px;flex:none}
.row .proj{font-weight:700;font-size:34px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .addr{font-family:var(--font-mono);font-size:23px;color:var(--white);margin-top:6px;line-height:1.35}
/* meta lines WRAP rather than ellipsis-crop — losing a flag to "…" is worse
   than an extra line. Line budget is enforced by the FIT demotion below. */
.row .meta{font-family:var(--font-mono);font-size:22px;color:var(--gray);margin-top:5px;line-height:1.35;
  overflow-wrap:break-word}
.row .meta .flag{color:var(--gold)}
.row .meta .flag.warn{color:var(--coral)}
.row .val{text-align:right}
.row .val .v1{font-weight:800;font-size:48px;color:var(--gold);letter-spacing:-1px}
.row .val .v2{font-family:var(--font-mono);font-size:25px;color:var(--gray);margin-top:8px}
.row .val .v1.g{color:var(--green)}.row .val .v1.l{color:var(--coral)}
.row .val .v2.g{color:#7fd8a3}.row .val .v2.l{color:#e9a0a0}
/* L-SLIDE-7: .rows absorbs the slack and .note is flex:none, so an over-long
   note can never push the block past the 220px bottom padding into #dots
   (which sit at bottom:132px). Notes are still held to one line by budget. */
.rows{flex:1 1 auto;min-height:0}
.note{font-family:var(--font-mono);font-size:24px;color:var(--gray2);letter-spacing:2px;
  flex:none;margin-top:auto;padding-top:30px}

/* L-SLIDE-4 (binding): rows take TYPED FIELDS, never pre-joined strings.
     proj    optional. when absent, addr takes the bold line and no addr line renders
             (an em-dash placeholder reads as missing data).
     addr    address + masked unit
     type    property type          } line 2, joined
     tenure  condensed tenure       }
     hold    holding period         } line 3, P&L only
     ann     annualised return      }
     flag    exception note, rendered in gold (coral when cls==='l')
   Every leaderboard and P&L screen uses this one shape. */
function rowsHTML(list, valCls){
  return list.map((r,i)=>{
    const head  = r.proj ? r.proj : r.addr;
    const line1 = r.proj ? `<div class="addr">${r.addr}</div>` : '';
    /* L-SLIDE-5: three short meta lines beat two long ones.
         A: type · area
         B: tenure · hold · ann
         C: flag
       FIT = 658px who-column / (22px mono * 0.6) = 49 chars, held at 47 for
       safety. If a line still exceeds it the CSS wraps rather than crops. */
    const FIT = 47;
    let l2 = [r.type, r.area].filter(Boolean).join(' \u00b7 ');
    let l3 = [r.tenure, r.hold, r.ann].filter(Boolean).join(' \u00b7 ');
    if (l3.length > FIT && r.tenure && (r.hold || r.ann)) {
      l2 = [r.type, r.area, r.tenure].filter(Boolean).join(' \u00b7 ');
      l3 = [r.hold, r.ann].filter(Boolean).join(' \u00b7 ');
      if (l2.length > FIT) { l2 = [r.type, r.area].filter(Boolean).join(' \u00b7 ');
                             l3 = [r.tenure, r.hold, r.ann].filter(Boolean).join(' \u00b7 '); }
    }

    return `
    <div class="row" style="transition-delay:${i*0.14+0.15}s">
      <div class="rank">${i+1}</div>
      <div class="who">
        <div class="proj">${head}</div>
        ${line1}
        ${l2 ? `<div class="meta">${l2}</div>` : ''}
        ${l3 ? `<div class="meta">${l3}</div>` : ''}
        ${r.flag ? `<div class="meta"><span class="flag${r.cls==='l'?' warn':''}">${r.flag}</span></div>` : ''}
      </div>
      <div class="val"><div class="v1 ${r.cls||''}">${r.v1}</div><div class="v2 ${r.cls||''}">${r.v2}</div></div>
    </div>`;
  }).join('');
}

function rankScreen(id, title, seg, list, note){
  return `<div class="screen" id="${id}">
    <div class="kicker">${WK}</div>
    <div class="title">${title}</div>
    <div class="subtag">${seg}</div>
    <div class="rows">${rowsHTML(list)}</div>
    ${note?`<div class="note">${note}</div>`:''}
  </div>`;
}
function pnlScreen(id, seg, sub, list, note){
  return `<div class="screen" id="${id}">
    <div class="kicker">${WK}</div>
    <div class="title">${seg} — P &amp; L</div>
    <div class="subtag"><span class="dim">${sub}</span></div>
    <div class="rows">${rowsHTML(list)}</div>
    ${note?`<div class="note">${note}</div>`:''}
  </div>`;
}

/* L-SLIDE-1: every number in a heading derives from the DATA block */
function rankTitle(list, segTotal, label){
  return (list.length >= segTotal)
    ? `ALL ${segTotal} \u2014 ${label}`
    : `TOP ${list.length} \u2014 ${label}`;
}
/* L-SLIDE-3 (new): when a list is TRUNCATED to fit the slide, the heading must
   state shown-of-actual. pnlSub counts the rendered list, which silently reads
   "All N losses" whenever N < the real count. */
function lossSub(list, actualN, total, seg){
  return (list.length >= actualN)
    ? `All ${actualN} losses \u00b7 ${actualN} of ${total} pairs`
    : `Top ${list.length} of ${actualN} losses \u00b7 ${actualN} of ${total} pairs`;
}
/* L-SLIDE-3 applied to the gains side too: with a four-way split the gains list
   is truncated far more often than the loss list, and "All 17 gains" on a slide
   showing 5 rows is the same defect lossSub was written to stop. */
function gainSub(list, actualN, total, seg){
  return (list.length >= actualN)
    ? `All ${actualN} ${seg} pairs profitable`
    : `Top ${list.length} of ${actualN} gains \u00b7 ${actualN} of ${total} pairs`;
}
function pnlSub(list, total, seg, lossOnly){
  const g = list.filter(r=>r.cls!=='l').length, l = list.filter(r=>r.cls==='l').length;
  if(lossOnly) return `All ${l} losses \u00b7 ${l} of ${total} pairs`;
  if(l===0)    return `All ${g} ${seg} pairs profitable`;
  return `${total} ${seg} pairs \u00b7 ${g} gains, ${l} loss${l>1?'es':''}`;
}

const SEQ = [
  {id:'s-intro', dur:4.0},
  {id:'s-gate',  dur:4.0},
  {id:'s-cp', dur:3.2},{id:'s-cf', dur:3.2},

  {id:'s-ig', dur:3.6},{id:'s-il', dur:3.2},
  {id:'s-outro', dur:4.4}
];
const dots = document.getElementById('dots');
SEQ.forEach(()=>dots.insertAdjacentHTML('beforeend','<span></span>'));

function fit(){
  const s = Math.min(innerWidth/1080, innerHeight/1920);
  stage.style.transform = `scale(${s})`;
  stage.style.left = ((innerWidth-1080*s)/2)+'px';
  stage.style.position='absolute';
}
addEventListener('resize',fit); fit();

let timers=[];
function play(){
  timers.forEach(clearTimeout); timers=[];
  document.querySelectorAll('.screen').forEach(el=>{el.classList.remove('show');
    el.querySelectorAll('.row,.stat,.fact,.flrow').forEach(r=>r.classList.remove('in'));});
  let t=0.3;
  SEQ.forEach((s,i)=>{
    timers.push(setTimeout(()=>{
      document.querySelectorAll('.screen').forEach(el=>el.classList.remove('show'));
      const el=document.getElementById(s.id);
      el.classList.add('show');
      requestAnimationFrame(()=>requestAnimationFrame(()=>
        el.querySelectorAll('.row,.stat,.fact,.flrow').forEach(r=>r.classList.add('in'))));
      dots.querySelectorAll('span').forEach((d,j)=>d.classList.toggle('on',j<=i));
      if(s.id==='s-intro') countUp();
    }, t*1000));
    t+=s.dur;
  });
}
function countUp(){
  const el=document.getElementById('bignum'), T=DATA.meta.total, D=1800, st=performance.now();
  (function f(n){const p=Math.min((n-st)/D,1), e=1-Math.pow(1-p,3);
    el.textContent='S$'+(T*e).toFixed(1)+'M';
    if(p<1)requestAnimationFrame(f);})(st);
}
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')play();});
let idle;function hint(){document.getElementById('hint').classList.remove('hide');
  clearTimeout(idle);idle=setTimeout(()=>document.getElementById('hint').classList.add('hide'),2500);}
addEventListener('mousemove',hint);hint();
setTimeout(()=>document.getElementById('hint').classList.add('hide'),2500);
play();
