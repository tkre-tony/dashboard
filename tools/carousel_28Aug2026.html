  background-size:78px 78px;pointer-events:none}
.slide::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 300px 80px rgba(0,0,0,.5);pointer-events:none}
.slide>*{position:relative;z-index:2}

.badge{position:absolute;top:40px;left:92px;z-index:3;font-family:var(--font-mono);font-weight:700;font-size:26px;
  color:var(--gold);border:2px solid var(--gold);border-radius:9px;padding:6px 13px;letter-spacing:2px}
.foot{position:absolute;left:92px;right:92px;bottom:44px;z-index:3;display:flex;justify-content:space-between;
  font-family:var(--font-mono);font-size:20px;color:var(--gray2);letter-spacing:2px}

.kicker{font-family:var(--font-mono);font-size:24px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;margin:22px 0 12px}
.title{font-weight:800;font-size:58px;line-height:1.05;letter-spacing:-1px}
.subtag{font-family:var(--font-mono);font-size:24px;letter-spacing:4px;color:var(--gray);text-transform:uppercase;margin-top:12px}
/* L-SLIDE-7 (landscape): note in FLOW, not absolute. Absolute positioning put
   it on top of row 5 on every five-row slide. .rows absorbs the slack. */
.rows{flex:1 1 auto;min-height:0}
.note{flex:none;margin-top:auto;padding-top:16px;font-family:var(--font-mono);font-size:19px;
  color:var(--gray2);letter-spacing:1.5px;line-height:1.4}

#s1{justify-content:center;align-items:center;text-align:center}
#s1 .wk{font-weight:800;font-size:84px;margin-top:8px}
#s1 .big{font-weight:800;font-size:208px;color:var(--gold);letter-spacing:-6px;line-height:1;margin:26px 0 18px}
#s1 .cav{font-family:var(--font-mono);font-size:34px;letter-spacing:6px;color:var(--white)}

.splitlab .l{color:var(--peri)}.splitlab .r{color:var(--gold)}

.row .addr{font-family:var(--font-mono);font-size:22px;color:var(--white);margin-top:5px;line-height:1.3}
.row .meta{font-family:var(--font-mono);font-size:19px;color:var(--gray);margin-top:3px;line-height:1.25;overflow-wrap:break-word}

.row .val .v1{font-weight:800;font-size:40px;color:var(--gold);letter-spacing:-1px}
.row .val .v2{font-family:var(--font-mono);font-size:22px;color:var(--gray);margin-top:6px}
.row .val .v1.g{color:var(--green)}.row .val .v1.l{color:var(--coral)}
.row .val .v2.g{color:#7fd8a3}.row .val .v2.l{color:#e9a0a0}

.facts{margin-top:42px;display:flex;flex-direction:column;gap:20px}

@page{size:1920px 1080px;margin:0}
@media print{

  {lab:"30-33 YRS",    n:19},
  {lab:"55-60 YRS",    n:18},
  {lab:"FH / 999 YRS", n:7},
  {lab:"99 YRS",       n:4}
];

/* ============================================================
   CAROUSEL RENDERER — 1920x1080 landscape, print-to-PDF
   Reads the SAME DATA object as the reel. L-SLIDE-1..6 apply.
   The 27 Jul carousel kept its own copy of the numbers and drifted
   from the reel by 10 caveats, S$5.35M and two whole pair counts.
   ============================================================ */
const WK = DATA.meta.week.toUpperCase();
const FOOT = `<div class="foot"><span>@propertyatlassg &nbsp;·&nbsp; propertyatlas.sg</span>
  <span>TK Real Estate Pte Ltd &nbsp;|&nbsp; Estate Agent Licence No : L3011027G</span></div>`;
const BADGE = `<div class="badge">P|A</div>`;

/* L-SLIDE-5: identical line packing to the reel */
const FIT = 47;
function metaLines(r){
  let l2 = [r.type, r.area].filter(Boolean).join(' · ');
  let l3 = [r.tenure, r.hold, r.ann].filter(Boolean).join(' · ');
  if (l3.length > FIT && r.tenure && (r.hold || r.ann)) {
    l2 = [r.type, r.area, r.tenure].filter(Boolean).join(' · ');
    l3 = [r.hold, r.ann].filter(Boolean).join(' · ');
    if (l2.length > FIT) { l2 = [r.type, r.area].filter(Boolean).join(' · ');
                           l3 = [r.tenure, r.hold, r.ann].filter(Boolean).join(' · '); }
  }
  return [l2, l3];
}
/* LANDSCAPE ROW = 2 LINES (portrait uses 4).
   1336px column holds 106 chars at 21px, but 1080px of height only fits five
   two-line rows. So the wide axis absorbs what the tall axis cannot: address,
   type, tenure, area, hold, ann and flag all share line 2.
   Same DATA, same fields — different packing for a different aspect ratio. */
const LFIT = 100;
function rowsHTML(list){
  return list.map((r,i)=>{
    const head = r.proj ? r.proj : r.addr;
    const segs = [];
    if (r.proj) segs.push(r.addr);
    [r.type, r.tenure, r.area, r.hold, r.ann].forEach(v=>{ if(v) segs.push(v); });
    let line = segs.join(' \u00b7 ');
    const flag = r.flag ? `<span class="flag${r.cls==='l'?' warn':''}">${r.flag}</span>` : '';
    const withFlag = r.flag ? line + ' \u00b7 ' + r.flag : line;
    const oneLine = withFlag.length <= LFIT;
    return `<div class="row">
      <div class="rank">${i+1}</div>
      <div class="who">
        <div class="proj">${head}</div>
        <div class="meta">${line}${oneLine && flag ? ' \u00b7 '+flag : ''}</div>
        ${!oneLine && flag ? `<div class="meta">${flag}</div>` : ''}
      </div>
      <div class="val"><div class="v1 ${r.cls||''}">${r.v1}</div><div class="v2 ${r.cls||''}">${r.v2}</div></div>
    </div>`;
  }).join('');
}
function slide(inner, id){ return `<div class="slide"${id?` id="${id}"`:''}>${BADGE}${inner}${FOOT}</div>`; }
function board(title, seg, list, note){
  return slide(`<div class="kicker">${WK}</div><div class="title">${title}</div>
    <div class="subtag">${seg}</div><div class="rows">${rowsHTML(list)}</div>
    ${note?`<div class="note">${note}</div>`:''}`);
}
/* L-SLIDE-1: every number below reads from DATA */
const P = DATA.pnl, M = DATA.meta, G = DATA.gate;
const lossSub = (list,a,t)=> list.length>=a
  ? `All ${a} losses · ${a} of ${t} pairs`
  : `Top ${list.length} of ${a} losses · ${a} of ${t} pairs`;
const gainSub = (list,a,t,seg)=> list.length>=a
  ? `All ${a} ${seg} pairs profitable`
  : `Top ${list.length} of ${a} gains · ${a} of ${t} pairs`;

const html = [
  /* 1 — intro */
  slide(`<div class="kicker">Weekly Caveat Wrap</div>
    <div class="wk">${M.week}</div>
    <div class="big">S$${M.total}M</div>
    <div class="cav">${M.caveats} CAVEATS &nbsp;·&nbsp; ${M.matched} MATCHED RESALES</div>
    <div class="splitwrap">
      <div class="splitbar"><div class="ind" style="width:${M.ind/M.caveats*100}%"></div><div class="com" style="flex:1"></div></div>
      <div class="splitlab"><span class="l">INDUSTRIAL ${M.ind}</span><span class="r">COMMERCIAL ${M.com}</span></div>
    </div>`, 's1'),

  /* 2 — week in numbers */
  slide(`<div class="kicker">${WK}</div><div class="title">THE WEEK IN NUMBERS</div>
    <div class="subtag">URA REALIS · RELEASES ${M.releases}</div>
    <div class="statgrid">
      <div class="stat"><div class="n">S$${M.total}M</div><div class="lab">Total value</div></div>
      <div class="stat"><div class="n w">${M.caveats}</div><div class="lab">Caveats</div></div>
      <div class="stat"><div class="n p">${M.matched}</div><div class="lab">Matched resales</div></div>
      <div class="stat"><div class="n g">${M.matched-(P.indLossN+P.commLossN)} / ${P.indLossN+P.commLossN}</div><div class="lab">Gains / losses</div></div>
    </div>
    <div class="bar2">
      <div class="bigrow"><span class="k">RESALE</span><span class="n">${M.resaleN} caveats</span><span class="v">${M.resaleV}</span></div>
      <div class="bigrow"><span class="k">NEW SALE</span><span class="n">${M.newN} caveats</span><span class="v gold">${M.newV}</span></div>
    </div>
    <div class="note">${M.matched} OF ${M.caveats} CAVEATS MATCHED A PRIOR TRANSACTION · ${M.caveats-M.matched} UNMATCHED ·
      NET REALISED ${M.netRealised} ACROSS ALL ${M.matched} PAIRS</div>`),

  /* 3-6 — leaderboards */
  board('TOP 5 — HIGHEST VALUE','INDUSTRIAL', DATA.indPrice, DATA.notes.indPrice),
  board('TOP 5 — PRICE PSF','INDUSTRIAL', DATA.indPsf, DATA.notes.indPsf),
  board('TOP 5 — HIGHEST VALUE','COMMERCIAL', DATA.commPrice, DATA.notes.commPrice),
  board('TOP 5 — PRICE PSF','COMMERCIAL', DATA.commPsf, DATA.notes.commPsf),

  /* 7 — GATE+ */
  slide(`<div class="kicker">${WK} · LAUNCH TRACKER</div><div class="title">${G.title}</div>
    <div class="subtag">${G.addr}</div>
    <div class="statgrid">
      <div class="stat"><div class="n w">${G.caveats}</div><div class="lab">New-sale caveats</div></div>
      <div class="stat"><div class="n">S$${G.totalM}M</div><div class="lab">Total lodged</div></div>
      <div class="stat"><div class="n w">S$${G.medPsf}</div><div class="lab">Median psf</div></div>
      <div class="stat"><div class="n w">S$${G.lo}–${G.hi}</div><div class="lab">PSF range</div></div>
    </div>
    <div class="facts">${G.facts.map(f=>`<div class="fact">▸&nbsp; ${f}</div>`).join('')}</div>`),

  /* 8-10 — P&L */
  board('COMMERCIAL — P &amp; L', gainSub(P.commGains,P.commGainsN,P.commTotal,'commercial'), P.commGains, P.commGainsNote),
  board('INDUSTRIAL — P &amp; L', gainSub(P.indGains,P.indGainsN,P.indTotal,'industrial'), P.indGains, P.gainsNote),
  board('INDUSTRIAL — P &amp; L', lossSub(P.indLoss,P.indLossN,P.indTotal), P.indLoss, P.lossNote),

  /* 11 — tenure */
  (()=>{const T=DATA.tenure, mx=Math.max(...T.map(t=>t.n));
    const col=l=>/FH|999/.test(l)?'var(--gold)':/^30/.test(l)?'var(--coral)':'var(--peri)';
    return slide(`<div class="kicker">${WK} · LEASE TENURE</div>
      <div class="title">${T.filter(t=>/^30|33/.test(t.lab)).reduce((a,t)=>a+t.n,0)} OF ${M.caveats} SIT ON 30–33 YR LEASES</div>
      <div class="subtag">TENURE AT POINT OF SALE</div>
      <div class="tbars">${T.map(t=>`<div class="tbar"><div class="lab">${t.lab}</div>
        <div class="track"><div class="fill" style="width:${t.n/mx*100}%;background:${col(t.lab)}"></div></div>
        <div class="n">${t.n}</div></div>`).join('')}</div>
      <div class="note">BUCKETS SUM TO ${T.reduce((a,t)=>a+t.n,0)} — ALL ${M.caveats} CAVEATS</div>`);})(),

  /* 12 — outro */
  `<div class="slide" id="outro"><div class="topbar"></div>
     <div class="half">
       <div class="pa">P|A</div><div class="brand">PROPERTYATLAS</div>
       <div class="tag">Singapore Commercial &amp; Industrial<br>Real Estate Intelligence</div>
       <div class="rule"></div><div class="url">propertyatlas.sg</div>
     </div>
     <div class="divider"></div>
     <div class="half">
       <div class="ask">Looking to buy, sell or lease<br>commercial &amp; industrial space?</div>
       <div class="rule"></div>
       <div class="co">TK REAL ESTATE PTE LTD</div>
       <div class="nm">Tony Koe</div>
       <div class="rl">Founder, Key Executive Officer</div>
       <div class="rl">CEA Licence R003757I</div>
       <div class="ct">Mobile : (+65) 9797 1118 &nbsp;|&nbsp; Email : tony@tkre.sg</div>
     </div>${FOOT}</div>`
].join('\n');

document.getElementById('deck').innerHTML = html;

</script>
</body></html>
